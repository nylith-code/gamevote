<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Vote Results</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <style>
    :root {
      --pico-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --pico-border-radius: 1rem;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 34rem),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.18), transparent 30rem),
        #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    main.container {
      max-width: 1180px;
      width: min(100%, 1180px);
      padding: clamp(0.5rem, 2vw, 2rem);
    }

    article, .panel {
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.35);
      margin: 0;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      min-width: 0;
    }

    .status-card {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .status-pill {
      display: inline-flex;
      gap: 0.45rem;
      align-items: center;
      width: fit-content;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.9);
      font-size: 0.9rem;
      min-width: 0;
    }

    .status-pill span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .version {
      color: #94a3b8;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: #f59e0b;
      box-shadow: 0 0 18px currentColor;
    }

    .connected .dot { background: #22c55e; color: #22c55e; }
    .disconnected .dot { background: #ef4444; color: #ef4444; }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .single {
      margin-top: 0.75rem;
    }

    h2 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.05rem, 4vw, 1.45rem);
    }

    .result {
      display: grid;
      grid-template-columns: 1.75rem minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .result:last-child { border-bottom: 0; }

    .rank {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.55rem;
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .result strong {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.15;
    }

    .bar-wrap {
      overflow: hidden;
      height: 0.45rem;
      margin-top: 0.35rem;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      transition: width 180ms ease;
    }

    .count {
      min-width: 2rem;
      text-align: right;
      color: #f8fafc;
      font-weight: 800;
    }

    .muted { color: #94a3b8; }
    .small { font-size: 0.84rem; }

    .chat-log {
      max-height: 28rem;
      overflow: auto;
      font-size: 0.9rem;
    }

    .chat-line {
      display: grid;
      grid-template-columns: 8rem 1fr;
      gap: 0.7rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .chat-line b {
      overflow: hidden;
      color: #7dd3fc;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-tag {
      display: inline-block;
      margin-left: 0.35rem;
      padding: 0.05rem 0.35rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      font-size: 0.72rem;
      vertical-align: middle;
    }

    .unmatched-tag {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
    }

    @media (max-width: 860px) {
      .status-card { align-items: stretch; }
      .chat-line { grid-template-columns: 1fr; gap: 0.15rem; }
    }

    @media (max-width: 420px) {
      .status-card { flex-direction: column; }
      .status-pill, #resetButton { width: 100%; }
      .small { display: none; }
      .chat-log { max-height: 18rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <article class="status-card" id="statusCard">
      <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Starting...</span></span>
      <span class="version">v0.3</span>
      <button id="resetButton" class="contrast">Clear votes</button>
    </article>

    <section class="grid-two">
      <article>
        <h2>Matched Games</h2>
        <p class="small muted">Top 5 canonical game matches.</p>
        <div id="matchedResults"></div>
      </article>
      <article>
        <h2>Repeated Unmatched</h2>
        <p class="small muted">Top 5 repeated unmatched normalized messages.</p>
        <div id="unmatchedResults"></div>
      </article>
    </section>

    <section class="single">
      <article>
        <h2>Recent Votes</h2>
        <div class="chat-log" id="chatLog"></div>
      </article>
    </section>
  </main>

      { name: "Max Payne", aliases: [] },
      { name: "Max Payne 2: The Fall of Max Payne", aliases: ["max payne 2"] },
      { name: "Devil May Cry", aliases: ["dmc1"] },
      { name: "Devil May Cry 3: Dante's Awakening", aliases: ["dmc3", "devil may cry 3"] },
      { name: "Bayonetta", aliases: [] },
      { name: "Nioh", aliases: [] },
      { name: "Dead Space", aliases: [] },
      { name: "Left 4 Dead", aliases: ["l4d"] },
      { name: "Left 4 Dead 2", aliases: ["l4d2"] },
      { name: "Battlefield 1942", aliases: ["bf1942"] },
      { name: "Battlefield 2", aliases: ["bf2"] },
      { name: "Gears of War", aliases: [] },
      { name: "Gears of War 2", aliases: [] },
      { name: "Tunic", aliases: [] },
      { name: "Pizza Tower", aliases: [] },
      { name: "Hi-Fi Rush", aliases: ["hifi rush"] },
      { name: "Sea of Stars", aliases: [] },
      { name: "Dave the Diver", aliases: [] }
    ];

    const state = {
      socket: null,
      reconnectTimer: null,
      reconnectDelay: 1500,
      voteKeysByUser: new Map(),
      votes: [],
      recent: []
    };

    const entries = buildSearchEntries(GAME_LIST);
    const fuse = new Fuse(entries, {
      includeScore: true,
      ignoreLocation: true,
      threshold: 0.34,
      keys: ["value", "compact"]
    });

    document.getElementById("resetButton").addEventListener("click", resetVotes);

    connect();
    render();

    function connect() {
      clearTimeout(state.reconnectTimer);
      setStatus("Connecting...", "");

      const nick = `justinfan${Math.floor(Math.random() * 900000 + 100000)}`;
      const socket = new WebSocket(TWITCH_IRC_WS);
      state.socket = socket;

      socket.addEventListener("open", () => {
        state.reconnectDelay = 1500;
        socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
        socket.send("PASS SCHMOOPIIE");
        socket.send(`NICK ${nick}`);
        socket.send(`JOIN #${CHANNEL}`);
        setStatus(`Connected to #${CHANNEL}`, "connected");
      });

      socket.addEventListener("message", (event) => {
        for (const line of String(event.data).split("\r\n")) {
          if (!line) continue;
          if (line.startsWith("PING")) {
            socket.send("PONG :tmi.twitch.tv");
            continue;
          }
          const parsed = parsePrivmsg(line);
          if (parsed) recordVote(parsed.user, parsed.displayName, parsed.message);
        }
      });

      socket.addEventListener("close", scheduleReconnect);
      socket.addEventListener("error", () => {
        setStatus("Connection error", "disconnected");
        socket.close();
      });
    }

    function scheduleReconnect() {
      setStatus(`Disconnected. Reconnecting in ${Math.round(state.reconnectDelay / 1000)}s...`, "disconnected");
      clearTimeout(state.reconnectTimer);
      state.reconnectTimer = setTimeout(connect, state.reconnectDelay);
      state.reconnectDelay = Math.min(state.reconnectDelay * 1.6, 15000);
    }

    function parsePrivmsg(line) {
      const match = line.match(/^@([^ ]+) :([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.+)$/);
      if (!match) return null;
      const tags = Object.fromEntries(match[1].split(";").map((tag) => {
        const [key, value = ""] = tag.split("=");
        return [key, value];
      }));
      return {
        user: (tags["user-id"] || match[2]).toLowerCase(),
        displayName: tags["display-name"] || match[2],
        message: match[3]
      };
    }

    function recordVote(userId, displayName, rawMessage) {
      const normalized = normalizeVoteText(rawMessage);
      if (!normalized || normalized.length < 2) return;

      const match = findGameMatch(normalized);
      const vote = match
        ? { kind: "matched", key: match.name, label: match.name, raw: rawMessage, score: match.score, displayName }
        : { kind: "unmatched", key: normalized, label: titleCase(normalized), raw: rawMessage, score: null, displayName };

      const userVoteKeys = state.voteKeysByUser.get(userId) || new Set();
      const userScopedKey = `${vote.kind}:${vote.key}`;
      if (userVoteKeys.has(userScopedKey)) return;

      userVoteKeys.add(userScopedKey);
      state.voteKeysByUser.set(userId, userVoteKeys);
      state.votes.push(vote);
      state.recent.unshift(vote);
      state.recent = state.recent.slice(0, 80);
      render();
    }

    function findGameMatch(input) {
      const compactInput = compact(input);
      const exact = entries.find((entry) => entry.normalized === input || entry.compact === compactInput);
      if (exact) return { name: exact.name, score: 1 };

      const results = fuse.search(input).slice(0, 8);
      let best = null;
      for (const result of results) {
        const entry = result.item;
        const lev = similarity(input, entry.normalized);
        const compactLev = similarity(compactInput, entry.compact);
        const containsBonus = entry.normalized.includes(input) || input.includes(entry.normalized) ? 0.08 : 0;
        const score = Math.max(lev, compactLev) + containsBonus - (result.score || 0) * 0.08;
        if (!best || score > best.score) best = { name: entry.name, score };
      }

      if (!best) return null;
      const len = input.length;
      const threshold = len <= 4 ? 0.96 : len <= 7 ? 0.82 : 0.72;
      return best.score >= threshold ? best : null;
    }

    function buildSearchEntries(games) {
      const seen = new Set();
      const searchEntries = [];
      for (const game of games) {
        const values = [game.name, ...game.aliases, stripEditionWords(game.name)];
        for (const value of values) {
          const normalized = normalizeVoteText(value);
          if (!normalized) continue;
          const key = `${game.name}:${normalized}`;
          if (seen.has(key)) continue;
          seen.add(key);
          searchEntries.push({ name: game.name, value, normalized, compact: compact(normalized) });
        }
      }
      return searchEntries;
    }

    function normalizeVoteText(value) {
      return String(value)
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/^!vote\s+/i, "")
        .replace(/^vote\s+/i, "")
        .replace(/&/g, " and ")
        .replace(/['’]/g, "")
        .replace(/[^a-z0-9]+/gi, " ")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function compact(value) {
      return value.replace(/\b(the|a|an|of|and|to|part|edition|remaster|remastered|remake|game)\b/g, "").replace(/\s+/g, "");
    }

    function stripEditionWords(value) {
      return value.replace(/\b(HD|Deluxe|Remastered|Remake|Definitive Edition|Game of the Year Edition)\b/gi, "");
    }

    function similarity(a, b) {
      if (a === b) return 1;
      if (!a || !b) return 0;
      const distance = levenshtein(a, b);
      return 1 - distance / Math.max(a.length, b.length);
    }

    function levenshtein(a, b) {
      const prev = Array.from({ length: b.length + 1 }, (_, index) => index);
      const curr = Array.from({ length: b.length + 1 }, () => 0);
      for (let i = 1; i <= a.length; i += 1) {
        curr[0] = i;
        for (let j = 1; j <= b.length; j += 1) {
          curr[j] = Math.min(
            curr[j - 1] + 1,
            prev[j] + 1,
            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
        for (let j = 0; j <= b.length; j += 1) prev[j] = curr[j];
      }
      return prev[b.length];
    }

    function resetVotes() {
      state.voteKeysByUser.clear();
      state.votes = [];
      state.recent = [];
      render();
    }

    function render() {
      const votes = state.votes;
      const matched = tally(votes.filter((vote) => vote.kind === "matched"));
      const unmatched = tally(votes.filter((vote) => vote.kind === "unmatched")).filter((row) => row.count > 1);

      renderResults("matchedResults", matched.slice(0, 5));
      renderResults("unmatchedResults", unmatched.slice(0, 5));
      renderLog();
    }

    function tally(votes) {
      const rows = new Map();
      for (const vote of votes) {
        const row = rows.get(vote.key) || { label: vote.label, count: 0 };
        row.count += 1;
        rows.set(vote.key, row);
      }
      return [...rows.values()].sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
    }

    function renderResults(id, rows) {
      const container = document.getElementById(id);
      if (!rows.length) {
        container.innerHTML = `<p class="muted">No votes yet.</p>`;
        return;
      }
      const max = Math.max(...rows.map((row) => row.count));
      container.innerHTML = rows.map((row, index) => `
        <div class="result">
          <span class="rank">${index + 1}</span>
          <div>
            <strong>${escapeHtml(row.label)}</strong>
            <div class="bar-wrap"><div class="bar" style="width:${Math.max(8, row.count / max * 100)}%"></div></div>
          </div>
          <span class="count">${row.count}</span>
        </div>
      `).join("");
    }

    function renderLog() {
      const log = document.getElementById("chatLog");
      if (!state.recent.length) {
        log.innerHTML = `<p class="muted">Waiting for chat votes...</p>`;
        return;
      }
      log.innerHTML = state.recent.map((vote) => `
        <div class="chat-line">
          <b>${escapeHtml(vote.displayName)}</b>
          <span>${escapeHtml(vote.raw)}
            <span class="match-tag ${vote.kind === "unmatched" ? "unmatched-tag" : ""}">${vote.kind === "matched" ? escapeHtml(vote.label) : "unmatched"}</span>
          </span>
        </div>
      `).join("");
    }

    function setStatus(text, className) {
      document.getElementById("statusText").textContent = text;
      document.getElementById("statusCard").className = `status-card ${className}`;
    }

    function titleCase(value) {
      return value.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[char]);
    }
  </script>
</body>
</html>
